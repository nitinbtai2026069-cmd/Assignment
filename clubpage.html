<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitin Pal - Coding Club</title>

    <style>
        /* CSS Variables */
        :root {
            --brand: #2f5bea;
            --light: #eef2ff;
            --dark: #1b2440;
            --gap: 16px;
        }

        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding: var(--gap);
        }

        /* Element Selector */
        h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        h2 {
            margin-bottom: 10px;
        }

        /* ID Selector */
        #hero {
            background: var(--brand);
            color: white;
            text-align: center;
            padding: 32px var(--gap);
            border-radius: 10px;
        }

        /* Class Selector */
        .card {
            background: white;
            padding: var(--gap);
            margin-top: var(--gap);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th {
            background: var(--brand);
            color: white;
            text-align: left;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ccd;
        }

        input, select, textarea {
            padding: 8px;
            margin: 4px 0;
            width: 100%;
            border: 1px solid #ccd;
            border-radius: 5px;
        }

        button {
            background: var(--brand);
            color: white;
            border: 0;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: var(--dark);
        }

        footer {
            text-align: center;
            margin-top: var(--gap);
            padding: var(--gap);
        }
    </style>
</head>

<body>

    <div id="hero">
        <h1>Nitin Pal's Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </div>

    <div class="card">
        <h2>Upcoming Events</h2>

        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 Nov</td>
                    <td>Lab 1</td>
                </tr>

                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Register for Coding Club</h2>

        <form action="#" method="post">
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Nitin Pal" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" required>
            </p>

            <p>
                <label for="branch">Branch:</label>
                <select id="branch" name="branch">
                    <option value="BCA">BCA</option>
                    <option value="BTech">B.Tech</option>
                </select>
            </p>

            <p>
                <label for="reason">Why do you want to join?</label>
                <textarea id="reason" name="reason"
                          rows="3"></textarea>
            </p>

            <button type="submit">Register</button>
        </form>
    </div>

    <footer>
        <p>Created by Nitin Pal</p>
        <p>Web Development Assignment - Week 5</p>
    </footer>

</body>
</html>
