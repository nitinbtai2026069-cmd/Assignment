<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coding Club registration page">
    <title>Nitin Pal - Coding Club</title>
</head>
<body>

    <nav>
        <a href="#events">Events</a> |
        <a href="#register">Register</a>
    </nav>

    <h1>Coding Club</h1>
    <p>Welcome to the Coding Club registration page!</p>

    <h2 id="events">Upcoming Events</h2>

    <table border="1">
        <caption>Club Events</caption>
        <thead>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>
            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total events: 2</td>
            </tr>
        </tfoot>
    </table>

    <h2 id="register">Register for Coding Club</h2>

    <form action="#" method="post">

        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Nitin Pal" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required>
        </p>

        <p>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </p>

        <p>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
        </p>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <p>Interests:</p>
        <input type="checkbox" id="web" name="interests" value="Web">
        <label for="web">Web Development</label>

        <input type="checkbox" id="dsa" name="interests" value="DSA">
        <label for="dsa">DSA</label>

        <p>
            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option value="BCA">BCA</option>
                <option value="BTech">B.Tech</option>
            </select>
        </p>

        <p>
            <label for="msg">Why do you want to join?</label><br>
            <textarea id="msg" name="message"
                      rows="3" cols="30"></textarea>
        </p>

        <button type="submit">Register</button>

    </form>

    <footer>
        <p>Created by Nitin Pal</p>
    </footer>

</body>
</html>
